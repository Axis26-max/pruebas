<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registrar mis marcas · Academia 8 Islas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap">
<style>
  :root{--navy:#0d1b3e;--gold:#ecb33b;--ink:#1b2236;--muted:#69718a;--line:#cfd5e2;--soft:#f1f3f8;--danger:#b42318;--bg:#e8ebf2}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,"Segoe UI",Arial,sans-serif;padding:20px 16px}
  .sheet{max-width:640px;margin:0 auto;background:#fff;border-radius:6px;overflow:hidden}
  header{background:var(--navy);color:#fff;border-bottom:6px solid var(--gold);padding:18px 22px}
  header h1{font:700 26px/1.1 "Barlow Condensed",Arial,sans-serif;margin:0}
  header p{margin:4px 0 0;color:#c6cee3}
  main{padding:8px 22px 22px}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
  .card.bad{border-color:var(--danger);background:#fdf0ef}
  .card h2{font:700 20px "Barlow Condensed",Arial,sans-serif;color:var(--navy);margin:0 0 8px}
  .lbl{font-size:13px;color:var(--muted);margin:8px 0 3px}
  .marca{display:inline-flex;align-items:center;gap:5px}
  .marca input{width:3.2em;text-align:center;font:16px Barlow,Arial;border:1.5px solid var(--line);border-radius:7px;padding:9px 4px}
  .marca input.d1{width:2.6em} .marca input.d3{width:4.2em}
  .marca b{color:var(--navy)}
  .uni{font-size:12px;color:var(--muted)}
  select,input[type=date]{font:16px Barlow,Arial;border:1.5px solid var(--line);border-radius:7px;padding:9px;width:100%}
  .err{color:var(--danger);font-size:14px;margin-top:6px}
  .btn{font:600 16px Barlow,Arial;background:var(--gold);border:2px solid var(--gold);color:var(--navy);border-radius:8px;padding:12px 24px;cursor:pointer;margin-top:12px}
  .btn[disabled]{opacity:.6}
  .ok{border-left:5px solid var(--gold);background:#fff8e6;border-radius:6px;padding:14px 16px;margin-top:16px}
</style>
</head>
<body>
<div class="sheet">
  <header><h1>Registrar mis marcas</h1><p>Autotest del mes<span id="nom"></span></p></header>
  <main>
    <p>Escribe tu marca de <b>las cuatro pruebas</b>. Con ellas preparamos tu informe y tu plan del mes siguiente.</p>
    <form id="f"><div id="pruebas"></div>
      <p class="err" id="err" hidden></p>
      <button class="btn" type="submit" id="enviar">Enviar mis marcas</button>
    </form>
    <div class="ok" id="ok" hidden><b>¡Marcas recibidas!</b><br>En las próximas horas te llegarán tu informe mensual y tu plan del mes siguiente.</div>
  </main>
</div>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzLHjIWWOFcees8gpbKrwIVqvzaqKJmZZijuF4sYjWlkrPLwpHvSX1L1L61qVqk1UIT/exec';
  var ID = (location.search.match(/[?&]id=([^&]+)/) || [])[1] || '';
  ID = decodeURIComponent(ID);
  function llamar(accion, args, ok, ko){
    fetch(API, { method: 'POST', body: JSON.stringify({ accion: accion, args: args }) })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j.ok) ok(j.resultado); else ko(new Error(j.error)); })
      .catch(function(){ ko(new Error('No hay conexión con el servidor. Revisa tu conexión e inténtalo de nuevo.')); });
  }
  llamar('nombre', [ID], function(r){ var n = document.getElementById('nom'); if (n && r.nombre) n.textContent = ' · ' + r.nombre; }, function(){});
  var q = function(s, c){ return (c || document).querySelector(s); };
  var P = [
    {id:'m50', n:'50 m lisos', uni:'segundos , centésimas', ej:'8 , 20', med:['Cronometrada por otra persona','Con reloj o app'], partes:[{k:'s',min:5,max:20,ph:'8',dig:2,tras:','},{k:'c',min:0,max:99,ph:'20',dig:2}]},
    {id:'m800', n:'800 m', uni:'minutos : segundos', ej:'3 : 28', med:['Cronometrada por otra persona','Con reloj o app'], partes:[{k:'min',min:1,max:9,ph:'3',dig:1,tras:':'},{k:'s',min:0,max:59,ph:'28',dig:2}]},
    {id:'msalto', n:'Salto de longitud', uni:'centímetros', ej:'315', med:['Con cinta métrica'], partes:[{k:'cm',min:100,max:700,ph:'315',dig:3}]},
    {id:'mnado', n:'50 m libres', uni:'minutos : segundos , décimas', ej:'0 : 52 , 0', med:['Cronometrada por otra persona','Con reloj o app'], partes:[{k:'min',min:0,max:3,ph:'0',dig:1,tras:':',opc:true},{k:'s',min:0,max:59,ph:'52',dig:2,tras:','},{k:'d',min:0,max:9,ph:'0',dig:1,opc:true}]}
  ];
  var hoy = new Date().toISOString().slice(0, 10);
  q('#pruebas').innerHTML = P.map(function(m){
    return '<div class="card" id="c-'+m.id+'"><h2>'+m.n+'</h2><div class="lbl">Tu marca</div><span class="marca">' +
      m.partes.map(function(p){ return '<input inputmode="numeric" maxlength="'+p.dig+'" class="d'+p.dig+'" id="'+m.id+'-'+p.k+'" placeholder="'+p.ph+'">' + (p.tras ? '<b>'+p.tras+'</b>' : ''); }).join('') +
      '</span><div class="uni">'+m.uni+'</div><div class="lbl">Cómo se midió</div><select id="'+m.id+'-med"><option value="">Elige una opción</option>' +
      m.med.map(function(o){ return '<option>'+o+'</option>'; }).join('') + '</select><div class="lbl">Día en que te mediste</div><input type="date" id="'+m.id+'-fecha" max="'+hoy+'" value="'+hoy+'"></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.marca input'), function(el){ el.addEventListener('input', function(){
    var v = this.value.replace(/\D/g, '').slice(0, +this.maxLength); if (v !== this.value) this.value = v;
    if (v.length === +this.maxLength) { var all = Array.prototype.slice.call(this.closest('.card').querySelectorAll('.marca input')); var n = all[all.indexOf(this) + 1]; if (n) n.focus(); }
  }); });
  function dos(x){ x = String(+x); return x.length < 2 ? '0' + x : x; }
  function leer(m){
    var v = m.partes.map(function(p){ return q('#'+m.id+'-'+p.k).value.trim(); });
    if (v.every(function(x){ return x === ''; })) return '';
    if (!m.partes.every(function(p, i){ return (v[i] === '' && p.opc) || (/^\d+$/.test(v[i]) && +v[i] >= p.min && +v[i] <= p.max); })) return null;
    if (m.id === 'msalto') return (+v[0] / 100).toFixed(2).replace('.', ',');
    if (m.id === 'm800') return (+v[0]) + ':' + dos(v[1]);
    if (m.id === 'mnado') { var min = +(v[0] || 0); if (!min && +v[1] < 20) return null; return (min ? min + ':' + dos(v[1]) : String(+v[1])) + ',' + (v[2] || '0'); }
    return (+v[0]) + ',' + dos(v[1]);
  }
  q('#f').addEventListener('submit', function(e){
    e.preventDefault();
    var fallos = [], marcas = P.map(function(m){
      var mv = leer(m), med = q('#'+m.id+'-med').value, fe = q('#'+m.id+'-fecha').value, falta = [];
      if (mv === '') falta.push('escribe tu marca'); else if (mv == null) falta.push('revisa los números (' + m.uni + ', por ejemplo ' + m.ej + ')');
      if (!med) falta.push('elige cómo se midió');
      if (!fe) falta.push('indica el día'); else if ((new Date() - new Date(fe)) / 86400000 > 21) falta.push('la marca tiene más de 3 semanas: vuelve a medirte');
      q('#c-'+m.id).classList.toggle('bad', falta.length > 0);
      if (falta.length) fallos.push('<b>' + m.n + ':</b> ' + falta.join('; ') + '.');
      return { prueba: m.n, nunca: false, marca: mv, medicion: med, fecha: fe ? fe.slice(5, 7) + '/' + fe.slice(0, 4) : '' };
    });
    var err = q('#err');
    if (fallos.length) { err.innerHTML = fallos.join('<br>'); err.hidden = false; return; }
    err.hidden = true; var b = q('#enviar'); b.disabled = true; b.textContent = 'Enviando…';
    llamar('registrarMarcas', [ID, marcas], function(){ q('#f').hidden = true; q('#ok').hidden = false; },
      function(e){ b.disabled = false; b.textContent = 'Enviar mis marcas'; err.textContent = (e && e.message) || 'No se ha podido enviar. Inténtalo de nuevo.'; err.hidden = false; });
  });
})();
</script>
</body>
</html>
