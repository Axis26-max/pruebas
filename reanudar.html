<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Volver a entrenar · Academia 8 Islas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap">
<style>
  body{margin:0;background:#e8ebf2;color:#1b2236;font:16px/1.5 Barlow,"Segoe UI",Arial,sans-serif;padding:24px 16px}
  .sheet{max-width:560px;margin:0 auto;background:#fff;border-radius:6px;overflow:hidden}
  header{background:#0d1b3e;color:#fff;border-bottom:6px solid #ecb33b;padding:18px 22px;font:700 24px "Barlow Condensed",Arial,sans-serif}
  main{padding:20px 22px}
</style>
</head>
<body>
<div class="sheet"><header>Academia 8 Islas</header><main id="txt">Un momento…</main></div>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzLHjIWWOFcees8gpbKrwIVqvzaqKJmZZijuF4sYjWlkrPLwpHvSX1L1L61qVqk1UIT/exec';
  var ID = (location.search.match(/[?&]id=([^&]+)/) || [])[1] || '';
  ID = decodeURIComponent(ID);
  function llamar(accion, args, ok, ko){
    fetch(API, { method: 'POST', body: JSON.stringify({ accion: accion, args: args }) })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j.ok) ok(j.resultado); else ko(new Error(j.error)); })
      .catch(function(){ ko(new Error('No hay conexión con el servidor. Revisa tu conexión e inténtalo de nuevo.')); });
  }
  llamar('nombre', [ID], function(r){ var n = document.getElementById('nom'); if (n && r.nombre) n.textContent = ' · ' + r.nombre; }, function(){});
  llamar('reanudar', [ID], function(r){ document.getElementById('txt').textContent = r.texto; },
    function(e){ document.getElementById('txt').textContent = (e && e.message) || 'No se ha podido completar. Responde a nuestro último correo y te ayudamos.'; });
})();
</script>
</body>
</html>
